plugins {
    id "com.android.application"
}

android {
    namespace "com.honta.vision"
    compileSdk 35

    defaultConfig {
        applicationId "com.honta.vision"
        minSdk 28
        targetSdk 35
        versionCode 1
        versionName "0.1.0-phase7"

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
                arguments "-DANDROID_STL=c++_shared"
            }
        }

        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }
}
